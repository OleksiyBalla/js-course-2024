<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Приклад використання Promise</title>
    </head>

    <body>
        <button>Завантажити</button>
        <br />
        <br />
        <script>
            document.querySelector("button").addEventListener("click", function () {
                let url1 = "https://images-assets.nasa.gov/image/PIA16239/PIA16239~orig.jpg";
                let url2 = "https://images-assets.nasa.gov/image/PIA22312/PIA22312~orig.jpg";

                let promise1 = downloadImage(url1);
                promise1.then(
                    (image) => document.body.append(image),
                    (e) => console.log(e.message)
                );

                let promise2 = downloadImage(url2);
                promise2.then(
                    (image) => document.body.append(image),
                    (e) => console.log(e.message)
                );
            });

            function downloadImage(url) {
                // Створюємо новий об'єкт Promise, який приймає в себе функцію з двома параметрами: resolve, reject
                // resolve - викликається, коли завантаження успішно завершено
                // reject - викликається, коли завантаження не вдалося
                let promise = new Promise(function (resolve, reject) {
                    let image = new Image(500); // аналог тегу <img width="500">
                    image.src = url; // аналог <img src="url">

                    image.onload = function () {
                        //вбудована подія
                        resolve(image);
                    };

                    image.onerror = function (e) {
                        //вбудована подія
                        reject(new Error("Не вдалося завантажити зображення" + this.src)); // new Error - створює новий вбудований об'єкт помилки
                    };
                });

                return promise;
            }
        </script>
    </body>
</html>
